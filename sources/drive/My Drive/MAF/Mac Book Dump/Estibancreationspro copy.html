                    <section class="min-h-screen pt-32 pb-16 bg-gray-950">
                        <div class="container mx-auto px-4 sm:px-8">
                            <h2 class="text-4xl md:text-5xl font-extrabold font-serif text-center mb-4 bg-gradient-to-r from-yellow-500 to-amber-300 bg-clip-text text-transparent">The Library. Knowledge and Adventures Untold.</h2>
                            <p class="text-center text-xl text-gray-400 max-w-3xl mx-auto mb-12">
                                Explore our full catalogue of works, featuring the 'Crossroads of Identity' saga and dozens of powerful standalone titles.
                            </p>

                            <div class="mb-16">
                                <h3 class="text-3xl font-bold font-serif text-yellow-500 mb-8 border-b border-yellow-800/50 pb-2">Crossroads of Identity: The Featured Series</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                    ${seriesCards}
                                </div>
                            </div>

                            <div>
                                <h3 class="text-3xl font-bold font-serif text-yellow-500 mb-8 border-b border-yellow-800/50 pb-2">Standalone Works (${standalones.length} Titles)</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                    ${standaloneCards}
                                </div>
                                <div class="text-center mt-12">
                                    <p class="text-gray-500 italic">...and ${hiddenCount > 0 ? hiddenCount : 0} more powerful standalone titles.</p>
                                </div>
                            </div>
                        </div>
                    </section>
                `;
            }

            if (page.startsWith('book')) {
                const bookId = parseInt(page.replace('book', ''), 10);
                const book = bookData.find(b => b.id === bookId);
                return book ? BookSection(book) : `<div class="text-center pt-32 text-white">Book Not Found</div>`;
            }

            if (page === 'login') {
                return AuthForm("Member Login", true);
            }
            
            if (page === 'register') {
                return AuthForm("New Member Registration", false);
            }

            if (page === 'animated') {
                return ContentPlaceholder('Animated Universe Access', 'This is the access point for **Racheticity**. Here you would find the secure, membership-gated video player and content management tools, complete with links to your social media shorts.');
            }

            if (page === 'dashboard') {
                return ContentPlaceholder('Dashboard', 'This is where logged-in members would manage their subscriptions, view reading lists, and access personalized content.');
            }

            return `<div class="text-center pt-32 text-white">404 - Page Not Found</div>`;
        }

        function render() {
            const root = document.getElementById('root');
            const content = getPageContent(currentPage);
            
            // Render the Header and Main content
            root.innerHTML = Header() + `<main>${content}</main>`;
        }
        
        // --- EVENT DELEGATION (Handling all clicks) ---

        document.addEventListener('click', (event) => {
            const target = event.target.closest('[data-page], [data-external], [data-action]');
            if (!target) return;

            // Handle External Link
            if (target.dataset.external === 'true' && target.dataset.page) {
                window.open(target.dataset.page, '_blank');
                return;
            }

            // Handle Internal Page Change
            if (target.dataset.page) {
                event.preventDefault(); // Stop default button/link behavior
                showPage(target.dataset.page);
                return;
            }

            // Handle Sign Out
            if (target.dataset.action === 'signout' && auth) {
                event.preventDefault();
                auth.signOut().then(() => {
                    console.log("User signed out.");
                    showPage('home'); // Redirect to home after sign out
                }).catch((error) => {
                    console.error("Sign out error:", error);
                });
                return;
            }
        });

        // Handle Auth Form Submission (Mock)
        document.addEventListener('submit', (event) => {
            if (event.target.id === 'auth-form') {
                event.preventDefault();
                const formAction = event.target.dataset.action;
                const email = event.target.email.value;
                
                // Mock success message (cannot use alert)
                console.log(\`${formAction.toUpperCase()} successful for email: \${email}\`);
                alert(\`Authentication Mock: \${formAction.toUpperCase()} successful for \${email}. Check console.\`);
                
                // In a real app, this is where you'd call:
                // if (formAction === 'login') { signInWithEmailAndPassword(auth, email, password); }
                // else { createUserWithEmailAndPassword(auth, email, password); }
                
                showPage('dashboard'); // Redirect to dashboard on mock success
            }
        });

        // Initial render when the script loads
        window.onload = render;

    </script>
</body>
</html>
